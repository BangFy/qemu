services:
  qemu:
    image: qemux/qemu
    container_name: qemu
    environment:
      BOOT: "kali"
      USERNAME: "MasR"
      PASSWORD: "R12345"
      DISK_SIZE: "200G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
    volumes:
      - ./qemu:/storage
    restart: always
    stop_grace_period: 2m
